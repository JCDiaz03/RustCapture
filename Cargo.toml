[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform-win",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Peso mínimo en release (f.4/f.5): compensa con creces los ~150 KB de
# recursos embebidos (atlas de iconos + .ico).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.dependencies]
rustcapture-core = { path = "crates/core" }
platform-win = { path = "crates/platform-win" }
thiserror = "2"
png = "0.18"
jpeg-encoder = "0.7"
time = { version = "0.3", features = ["local-offset"] }
pico-args = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
fontdue = "0.9"
# Ya venían en el árbol vía `png`: declararlas explícitas para el contenedor
# del .rcap (f.31) no engorda el binario.
crc32fast = "1"
flate2 = "1"
